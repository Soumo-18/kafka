<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Sharing Application</title>
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
<style>
    #map { height: 80vh; }
</style>
</head>
<body>
    <div id="map"></div>


     <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

     <script src="/socket.io/socket.io.js"></script>

     <script>

        const socket = io()

        const map = L.map('map').setView([51.505, -0.09], 13);

        const remoteMarkers = new Map()

        socket.on('server:location-update', (data) => {
            const { id, lat, lng} = data
            if(!remoteMarkers.has(id)) {
                const marker = L.marker([lat,lng]).addTo(map).bindPopup(id)
                remoteMarkers.set(id,marker)
            } else {
                 const existingMarker = remoteMarkers.get(id)
                 existingMarker.setLatLng([lat, lng]); 
            }
        })

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
             maxZoom: 19,
             attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);


         let myCurrentLocationMarker = null

         // Tracker for YOUR own location
    function startTracking() {
        if ("geolocation" in navigator) {
            // FIX 2: Use watchPosition for smoother real-time updates
            navigator.geolocation.watchPosition(
                (position) => {
                    const { latitude: lat, longitude: lng } = position.coords;

                    // Send to server
                    socket.emit('client:location:update', { lat, lng });

                    // Update your own marker on the UI
                    if (!myCurrentLocationMarker) {
                        myCurrentLocationMarker = L.marker([lat, lng]).addTo(map).bindPopup("You're Here");
                        map.setView([lat, lng], 15); // Only centers the VERY FIRST time
                    } else {
                        myCurrentLocationMarker.setLatLng([lat, lng]);
                        
                    }
                },
                (error) => console.error("Error getting location:", error),
                { enableHighAccuracy: true, maximumAge: 0 }
            );
        } else {
            alert('Geolocation not supported');
        }
    }

window.addEventListener('load', startTracking);

socket.on('server:user-disconnected', (id) => {
    if (remoteMarkers.has(id)) {
        map.removeLayer(remoteMarkers.get(id));
        remoteMarkers.delete(id);
    }
})




     </script>
    
</body>
</html>
